<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>技術分享 · 潮汐檔案室</title>
<meta name="theme-color" content="#04101c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#64b5d8; --warm:#d16261;
  --a10:rgba(100,181,216,.10); --a14:rgba(100,181,216,.14); --a30:rgba(100,181,216,.30);
  --a40:rgba(100,181,216,.40); --a55:rgba(100,181,216,.55);
  --ink:#04101c; --foam:#f2fbff; --mist:#b9d3df;
  --font-display:"Noto Serif TC",serif;
  --font-body:"Noto Serif TC",serif;
  --font-mono:"JetBrains Mono","Noto Serif TC",monospace;
  --gut:clamp(16px,4vw,56px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--font-body);font-weight:300;
  -webkit-font-smoothing:antialiased;min-height:100svh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

#bg{position:fixed;inset:0;z-index:0;background:url("assets/hero/06-deep.webp") center 26%/cover no-repeat}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,16,28,.55),rgba(4,16,28,.34) 40%,rgba(4,16,28,.78))}

.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px var(--gut);background:linear-gradient(180deg,rgba(6,20,34,.46),rgba(6,20,34,.14));
  -webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  border-bottom:1px solid rgba(255,255,255,.09)}
.brand{font-family:var(--font-display);font-size:.92rem;letter-spacing:.10em;white-space:nowrap}
.brand i{font-style:normal;opacity:.45;margin-left:.45em;font-size:.82em;letter-spacing:.14em}
.back{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;color:var(--accent);
  padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px var(--a30);transition:background .4s ease}
.back:hover{background:var(--a30);color:var(--foam)}

main{position:relative;z-index:10;max-width:940px;margin:0 auto;padding:118px var(--gut) 80px}
.glass{position:relative;border-radius:26px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 42%,var(--a10)),rgba(6,20,34,.34);
  -webkit-backdrop-filter:blur(46px) saturate(200%) brightness(.88);
  backdrop-filter:blur(46px) saturate(200%) brightness(.88);
  box-shadow:0 24px 70px rgba(0,10,20,.44),inset 0 1px 0 rgba(255,255,255,.28)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 38%,transparent 62%,var(--a55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}

h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:.05em;margin:0 0 10px;
  background-image:linear-gradient(178deg,rgba(255,255,255,.93),rgba(255,255,255,.62) 55%,rgba(255,255,255,.84)),
    url("assets/hero/06-deep.webp");
  background-size:100% 100%,cover;background-position:center,center;background-attachment:scroll,fixed;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(2,10,20,.8))}
.sub{color:var(--mist);font-size:.9rem;line-height:1.9;margin:0 0 34px}

.pad{padding:clamp(22px,4vw,40px)}
.compose{display:grid;gap:12px;margin-bottom:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea{
  width:100%;font-family:var(--font-body);font-size:.92rem;color:var(--foam);
  background:rgba(0,8,16,.34);border:1px solid rgba(255,255,255,.14);border-radius:13px;
  padding:13px 15px;outline:none;transition:border-color .3s ease}
input:focus,textarea:focus{border-color:var(--a55)}
textarea{min-height:118px;resize:vertical;line-height:1.85}
::placeholder{color:var(--mist);opacity:.45}
.btn{font-family:var(--font-body);font-size:.9rem;letter-spacing:.06em;padding:12px 26px;border:0;border-radius:13px;
  cursor:pointer;color:var(--ink);background:var(--accent);justify-self:start;
  box-shadow:0 8px 22px var(--a40);transition:transform .35s ease,opacity .3s ease}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.5;cursor:wait;transform:none}
.msg{font-family:var(--font-mono);font-size:.7rem;color:var(--warm);min-height:1.2em;letter-spacing:.06em}

.thread{padding:22px 0;border-top:1px solid rgba(255,255,255,.09)}
.thread:first-of-type{border-top:0}
.th-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.th-title{font-family:var(--font-display);font-weight:500;font-size:1.06rem;letter-spacing:.02em}
.th-meta{font-family:var(--font-mono);font-size:.66rem;color:var(--mist);opacity:.6;letter-spacing:.06em}
.th-body{color:var(--mist);font-size:.9rem;line-height:1.95;margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.replies{margin:16px 0 0;padding-left:16px;border-left:2px solid var(--a30);display:grid;gap:14px}
.rep .th-body{margin-top:5px;font-size:.86rem}
.toggle{margin-top:14px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;color:var(--accent);
  background:none;border:0;padding:0;cursor:pointer}
.rform{margin-top:14px;display:none;gap:10px;grid-template-columns:1fr}
.rform.open{display:grid}
.empty{color:var(--mist);opacity:.6;font-size:.9rem;line-height:2;text-align:center;padding:40px 0}
@media (max-width:640px){ .row2{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="bg"></div><div id="veil"></div>

<header class="topbar">
  <a class="brand" href="index.html">atridarling.site<i>archive</i></a>
  <a class="back" href="index.html">← 回檔案室</a>
</header>

<main>
  <h1>技術分享</h1>
  <p class="sub">踩過的坑、修好的 bug、來不及寫成文章的碎片。不用註冊，留個名字就能發。</p>

  <section class="glass pad">
    <div class="compose">
      <div class="row2">
        <input id="t-author" maxlength="24" placeholder="你的名字">
        <input id="t-title"  maxlength="80" placeholder="標題">
      </div>
      <textarea id="t-body" maxlength="4000" placeholder="想說什麼…"></textarea>
      <input id="t-hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      <button class="btn" id="t-send">發表</button>
      <div class="msg" id="t-msg"></div>
    </div>
  </section>

  <section class="glass pad" style="margin-top:22px">
    <div id="list"><div class="empty">載入中…</div></div>
  </section>
</main>

<script>
/* ══════════════════════════════════════════════════════════
   設定：API 位址。後端請部署 functions/api/lab-forum.js
   ══════════════════════════════════════════════════════════ */
const API = "/api/lab-forum";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = ts => {
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return "剛剛";
  if (d < 3600) return Math.floor(d/60) + " 分鐘前";
  if (d < 86400) return Math.floor(d/3600) + " 小時前";
  if (d < 2592000) return Math.floor(d/86400) + " 天前";
  return new Date(ts).toLocaleDateString("zh-TW");
};
const list = document.getElementById("list");

async function load(){
  try{
    const r = await fetch(API, { cache:"no-store" });
    if (!r.ok) throw new Error("api");
    const { threads = [] } = await r.json();
    render(threads);
  }catch(e){
    const local = location.protocol === "file:";
    list.innerHTML = `<div class="empty">${local
      ? "本機檔案模式沒有 /api，上傳到 Cloudflare Pages 後就會通。"
      : `讀不到 <code>${API}</code>。<br>檢查兩件事：<br>
         ① <code>functions/api/lab-forum.js</code> 在站台根目錄（和 lab/ 同層）<br>
         ② Pages 綁了名為 <code>LAB_FORUM</code> 的 KV<br><br>
         想確認後端活著，直接開 <code>${API}?diag=1</code> 看看回什麼。`}</div>`;
  }
}

function render(threads){
  if (!threads.length){ list.innerHTML = `<div class="empty">還沒有人說話。第一則就交給你了。</div>`; return; }
  list.innerHTML = threads.map(t => `
    <article class="thread">
      <div class="th-top">
        <span class="th-title">${esc(t.title)}</span>
        <span class="th-meta">${esc(t.author)} · ${when(t.ts)} · ${t.replies?.length || 0} 則回覆</span>
      </div>
      <p class="th-body">${esc(t.body)}</p>
      ${t.replies?.length ? `<div class="replies">${t.replies.map(r => `
        <div class="rep"><span class="th-meta">${esc(r.author)} · ${when(r.ts)}</span>
        <p class="th-body">${esc(r.body)}</p></div>`).join("")}</div>` : ""}
      <button class="toggle" data-toggle="${esc(t.id)}">回覆 ↓</button>
      <div class="rform" id="rf-${esc(t.id)}">
        <input maxlength="24" placeholder="你的名字" data-ra>
        <textarea maxlength="2000" placeholder="回覆…" data-rb></textarea>
        <button class="btn" data-reply="${esc(t.id)}">送出回覆</button>
        <div class="msg"></div>
      </div>
    </article>`).join("");
}

async function post(payload, btn, msgEl){
  btn.disabled = true; msgEl.textContent = "送出中…";
  try{
    if (location.protocol === "file:")
      throw new Error("你現在是用本機檔案開啟的，/api 不存在。要上傳到 Cloudflare Pages 才能發文。");
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json" },
                                 body: JSON.stringify(payload) });
    const txt = await r.text();
    let j = null; try { j = JSON.parse(txt); } catch { /* 回來的不是 JSON */ }
    if (!r.ok){
      if (r.status === 404)
        throw new Error("找不到 /api/lab-forum（404）。functions/ 資料夾要放在站台根目錄，和 lab/ 同一層。");
      throw new Error(j?.error || `伺服器回 ${r.status}：${txt.slice(0,120)}`);
    }
    if (!j) throw new Error("伺服器沒有回傳 JSON，通常代表請求被靜態頁面接走了。");
    msgEl.textContent = ""; return true;
  }catch(e){ msgEl.textContent = e.message; return false; }
  finally{ btn.disabled = false; }
}

document.getElementById("t-send").addEventListener("click", async e => {
  const author = document.getElementById("t-author").value.trim() || "路過";
  const title  = document.getElementById("t-title").value.trim();
  const body   = document.getElementById("t-body").value.trim();
  const msg    = document.getElementById("t-msg");
  if (!title || !body){ msg.textContent = "標題和內容都要填。"; return; }
  const ok = await post({ action:"thread", author, title, body,
                          hp: document.getElementById("t-hp").value }, e.target, msg);
  if (ok){ document.getElementById("t-title").value = ""; document.getElementById("t-body").value = ""; load(); }
});

list.addEventListener("click", async e => {
  const tg = e.target.closest("[data-toggle]");
  if (tg){ document.getElementById("rf-" + tg.dataset.toggle).classList.toggle("open"); return; }
  const rp = e.target.closest("[data-reply]");
  if (!rp) return;
  const form = rp.closest(".rform"), msg = form.querySelector(".msg");
  const author = form.querySelector("[data-ra]").value.trim() || "路過";
  const body   = form.querySelector("[data-rb]").value.trim();
  if (!body){ msg.textContent = "回覆內容是空的。"; return; }
  if (await post({ action:"reply", id: rp.dataset.reply, author, body }, rp, msg)) load();
});

load();
</script>
</body>
</html>
