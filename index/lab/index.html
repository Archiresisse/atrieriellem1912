<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>潮汐檔案室 · atridarling.site</title>
<meta name="description" content="已完成的遊戲、實用工具、訂閱連結與技術筆記。">
<meta name="theme-color" content="#04101c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════════
   [A] 設計代幣
   ══════════════════════════════════════════════════════════════ */
:root{
  --accent:#64b5d8;
  --warm:#d16261;
  /* 以下由 JS 依當前底圖寫入，CSS 只讀不算，避免每幀重新計算 color-mix */
  --a08:rgba(100,181,216,.08); --a10:rgba(100,181,216,.10); --a14:rgba(100,181,216,.14);
  --a20:rgba(100,181,216,.20); --a26:rgba(100,181,216,.26); --a30:rgba(100,181,216,.30);
  --a40:rgba(100,181,216,.40); --a55:rgba(100,181,216,.55); --a70:rgba(100,181,216,.70);
  --w14:rgba(209,98,97,.14);   --w30:rgba(209,98,97,.30);
  --w50:rgba(209,98,97,.50);   --w70:rgba(209,98,97,.70);
  --hero-img:url("assets/hero/01-wind.webp");

  --ink:#04101c;
  --foam:#f2fbff;
  --mist:#b9d3df;

  --blur:52px;
  --glass:rgba(6,20,34,.34);
  --fx:blur(var(--blur)) saturate(210%) brightness(.86);

  /* 全站中文一律 Noto Serif TC；等寬字只負責拉丁字母與代碼，
     CJK 會自動 fallback 回 Serif TC，所以中文不會變成別的字體 */
  --font-display:"Noto Serif TC",serif;
  --font-body:"Noto Serif TC",serif;
  --font-mono:"JetBrains Mono","Noto Serif TC",monospace;

  --gut:clamp(16px,4vw,56px);
  --sp:0;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--foam);
  font-family:var(--font-body);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.locked{overflow:hidden}
::selection{background:var(--accent);color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto}

/* ══════════════════════════════════════════════════════════════
   [B] 打底層
   ══════════════════════════════════════════════════════════════ */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ink)}
#stage-inner{position:absolute;inset:-4%;animation:kenburns 34s ease-in-out infinite alternate}
@keyframes kenburns{
  from{transform:scale(1.04) translate3d(0,0,0)}
  to  {transform:scale(1.12) translate3d(-1.5%,-2%,0)}
}
.frame{position:absolute;inset:0}
.grain{
  position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;
  opacity:0;transition:opacity var(--dur,1.5s) cubic-bezier(.33,.68,.35,1) var(--del,0s);
}
.grain.on{opacity:1}
#scrim{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(130% 90% at 50% -10%,transparent 20%,rgba(4,16,28,.42) 80%),
    linear-gradient(180deg,rgba(4,16,28,.34),rgba(4,16,28,.14) 40%,rgba(4,16,28,.58));
  opacity:calc(.62 + .3 * var(--sp));
}
#noise{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
#fx{position:fixed;inset:0;z-index:4;pointer-events:none}
/* 互動粒子要蓋在玻璃「上面」，不然拖曳灑出來的東西全被面板擋住看不見 */
#fxTop{position:fixed;inset:0;z-index:55;pointer-events:none}

/* 換幀時暫停推鏡並關掉滑鼠反光，讓合成器只需處理交叉淡入 */
body.switching #stage-inner{animation-play-state:paused}
body.switching .glass::after{opacity:0}

/* ══════════════════════════════════════════════════════════════
   [C] 玻璃系統
   ══════════════════════════════════════════════════════════════ */
.glass{
  position:relative;isolation:isolate;
  background:
    linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 42%,var(--a08)),
    var(--glass);
  -webkit-backdrop-filter:var(--fx);backdrop-filter:var(--fx);
  box-shadow:
    0 24px 70px rgba(0,10,20,.44),
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 0 -18px 40px -30px var(--a55);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,
    rgba(255,255,255,.62),rgba(255,255,255,.06) 36%,
    transparent 62%,var(--a55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),
    var(--a26),transparent 62%);
  opacity:0;transition:opacity .55s ease;
}
.glass:hover::after{opacity:1}

/* ── 頂欄：四個分頁收進同一片玻璃，不再是四顆浮在外面的膠囊 ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:12px;padding:10px var(--gut);
  background:linear-gradient(180deg,rgba(6,20,34,.46),rgba(6,20,34,.14));
  -webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  border-bottom:1px solid rgba(255,255,255,.09);
}
.brand{
  font-family:var(--font-display);font-weight:400;font-size:.92rem;letter-spacing:.10em;
  white-space:nowrap;color:var(--foam);opacity:.95;
}
.brand i{font-style:normal;opacity:.45;margin-left:.45em;font-size:.82em;letter-spacing:.14em}

.seg{
  position:relative;display:flex;gap:2px;margin-left:auto;padding:4px;border-radius:16px;
  background:rgba(255,255,255,.055);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 0 0 1px rgba(255,255,255,.07);
  overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.ind{
  position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:12px;pointer-events:none;
  background:var(--a30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 20px var(--a30);
  transition:transform .6s cubic-bezier(.22,.9,.3,1),width .6s cubic-bezier(.22,.9,.3,1),opacity .4s ease;
  opacity:0;
}
.tab{
  position:relative;z-index:1;padding:9px 16px;border-radius:12px;white-space:nowrap;
  font-family:var(--font-body);font-size:.87rem;font-weight:400;letter-spacing:.06em;color:var(--mist);
  transition:color .4s ease;
}
.tab:hover{color:var(--foam)}
.tab.active{color:var(--foam)}
.back{
  flex:none;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;color:var(--accent);
  padding:9px 13px;border-radius:12px;white-space:nowrap;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--a26);
  transition:background .4s ease,color .4s ease;
}
.back:hover{background:var(--a20);color:var(--foam)}

/* ── 切幀進度條 ── */
#track{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:rgba(255,255,255,.07)}
#timer{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,
    var(--a08),
    var(--a70) 55%,
    var(--accent));
}
#timer::after{                       /* 前緣的光點 */
  content:"";position:absolute;right:-3px;top:50%;width:6px;height:6px;border-radius:50%;
  transform:translateY(-50%);background:#fff;
  box-shadow:0 0 8px 2px var(--accent),0 0 20px 6px var(--a55);
}
#timer::before{                      /* 前緣往回拖的微光 */
  content:"";position:absolute;right:0;top:-2px;bottom:-2px;width:70px;
  background:linear-gradient(90deg,transparent,var(--a55));
  filter:blur(3px);
}

/* ══════════════════════════════════════════════════════════════
   [D] 版面
   ══════════════════════════════════════════════════════════════ */
main{position:relative;z-index:10}
.hero{min-height:100svh;display:flex;align-items:center;padding:104px var(--gut) 60px}
.console{
  border-radius:30px;padding:clamp(30px,4.6vw,62px);width:100%;
  background:
    linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.02) 44%,var(--a08)),
    linear-gradient(200deg,rgba(3,12,22,.30),rgba(3,12,22,.58)),
    var(--glass);
}
.hero h1{
  font-family:var(--font-display);font-weight:200;
  font-size:clamp(3rem,10.5vw,8.2rem);line-height:1.02;letter-spacing:.04em;margin:22px 0 26px;
  background-image:
    linear-gradient(176deg,rgba(255,255,255,.86),rgba(255,255,255,.50) 55%,rgba(255,255,255,.70)),
    var(--hero-img);
  background-size:100% 100%,cover;background-position:center,center;
  background-attachment:scroll,fixed;
  /* 這裡不能用 text-shadow，會把挖空的字壓黑，只能用 drop-shadow */
  opacity:0;filter:blur(18px) drop-shadow(0 6px 26px rgba(2,10,20,.8));transform:scale(1.02);
  transition:opacity 1.5s ease,filter 1.5s ease,transform 1.5s cubic-bezier(.2,.7,.3,1);
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .hero h1{-webkit-background-clip:text;background-clip:text;color:transparent}
}
.hero h1.in{opacity:1;filter:blur(0) drop-shadow(0 6px 26px rgba(2,10,20,.8));transform:none}
.hero p{max-width:33em;font-size:clamp(.95rem,1.5vw,1.1rem);line-height:2.05;color:var(--mist);margin:0}

.hud{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.14em;color:var(--mist);
}
.clock{display:inline-flex;align-items:baseline;gap:7px}
.clock b{font-family:var(--font-mono);font-weight:500;font-size:1.02rem;letter-spacing:.06em;color:var(--foam);
  font-variant-numeric:tabular-nums}
.clock em{font-style:normal;font-size:.6rem;letter-spacing:.18em;color:var(--accent);opacity:.8}
.clock .bl{animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.25}}
.ticks{display:flex;gap:7px}
.tick{width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.20);transition:background .8s ease,box-shadow .8s ease}
.tick.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.swatch{width:13px;height:13px;border-radius:4px;background:var(--accent);box-shadow:0 0 12px var(--a70)}
.swatch.w{background:var(--warm);box-shadow:0 0 12px var(--w70)}
.hud .sep{opacity:.35}

.section{padding:clamp(60px,9vh,120px) var(--gut);contain:layout paint}
.slab{border-radius:30px;padding:clamp(28px,4vw,56px)}
.eyebrow{font-family:var(--font-mono);font-size:.73rem;letter-spacing:.2em;color:var(--accent);display:block;min-height:1.4em}
.eyebrow.code{color:var(--warm);opacity:.9}
.section h2{font-family:var(--font-display);font-weight:500;font-size:clamp(1.85rem,4.4vw,2.9rem);letter-spacing:.05em;margin:14px 0 16px}
.lede{max-width:42em;color:var(--mist);line-height:2;font-size:.94rem;margin:0 0 40px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(276px,1fr))}

.card[data-tool],.card[data-game]{cursor:pointer}
.card{
  position:relative;border-radius:20px;padding:24px 22px;overflow:hidden;
  background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 55%,
             var(--a08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 10px 30px rgba(0,10,20,.26);
  transition:transform .5s cubic-bezier(.2,.7,.3,1),box-shadow .5s ease,background .8s ease;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.4),transparent 50%,
             var(--a40));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.card h3{font-family:var(--font-display);font-weight:500;font-size:1.12rem;letter-spacing:.03em;margin:0 0 10px}
.card p{color:var(--mist);font-size:.86rem;line-height:1.85;margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.08em;padding:3px 9px;border-radius:999px;
  color:var(--accent);background:var(--a14);
  border:1px solid var(--a30);
}
.tag.w{color:var(--warm);background:var(--w14);
       border-color:var(--w30)}
.go{font-family:var(--font-mono);font-size:.73rem;letter-spacing:.12em;display:inline-flex;align-items:center;gap:8px}
.go .arw{transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.card:hover .go .arw,.more:hover .arw{transform:translateX(6px)}

.sub{display:flex;align-items:center;gap:9px}
.sub code{
  flex:1;min-width:0;font-family:var(--font-mono);font-size:.7rem;color:var(--mist);
  background:rgba(0,8,16,.34);border:1px solid rgba(255,255,255,.13);border-radius:11px;
  padding:9px 11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.copy{
  flex:none;font-family:var(--font-body);font-size:.78rem;letter-spacing:.08em;
  padding:9px 15px;border-radius:11px;cursor:pointer;border:0;color:var(--ink);
  background:var(--accent);box-shadow:0 6px 18px var(--a40);
  transition:background .35s ease,transform .35s ease;
}
.copy:hover{transform:translateY(-1px)}
.copy.done{background:var(--warm);color:#fff}
.live{margin-top:12px;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;
  color:var(--mist);opacity:.8;display:none;align-items:center;gap:8px;flex-wrap:wrap}
.live.show{display:flex}
.live .dot{width:7px;height:7px;border-radius:50%;background:#57d98a;box-shadow:0 0 8px #57d98a}
.live.bad .dot{background:var(--warm);box-shadow:0 0 8px var(--warm)}
.note{
  font-family:var(--font-body);font-size:.78rem;line-height:1.95;color:var(--mist);opacity:.75;
  margin-top:26px;border-left:2px solid var(--w50);padding-left:14px;
}

.threads{border-radius:20px;overflow:hidden;background:rgba(255,255,255,.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.thread{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:19px 24px;border-bottom:1px solid rgba(255,255,255,.07);transition:background .4s ease}
.thread:last-child{border-bottom:0}
.thread:hover{background:var(--a10)}
.cat{
  font-family:var(--font-body);font-size:.72rem;letter-spacing:.08em;padding:4px 10px;border-radius:7px;
  color:var(--warm);background:var(--w14);
  border:1px solid var(--w30);white-space:nowrap;
}
.thread-t{font-size:.94rem;line-height:1.6}
.thread-m{font-family:var(--font-mono);font-size:.67rem;color:var(--mist);opacity:.6;margin-top:5px}
.reply{font-family:var(--font-mono);font-size:.79rem;color:var(--accent);white-space:nowrap}
.more{display:inline-block;margin-top:24px}

.game{padding:0;cursor:pointer}
.game .cover{aspect-ratio:16/10;background-size:cover;background-position:center 28%;position:relative}
.game .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(4,16,28,.88))}
.game .body{padding:20px 22px 24px;position:relative}
.state{
  position:absolute;top:-13px;right:20px;font-family:var(--font-body);font-size:.7rem;letter-spacing:.08em;
  padding:5px 12px;border-radius:999px;background:rgba(4,16,28,.8);
  border:1px solid var(--a40);color:var(--accent);
}
.state.wip{border-color:var(--w50);color:var(--warm)}

footer{
  position:relative;z-index:10;margin:0 var(--gut) 40px;padding:24px;border-radius:22px;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;color:var(--mist);text-align:center;
}

/* ══════════════════════════════════════════════════════════════
   [E] 遊戲詳情：點卡片展開的大標籤卡
   ══════════════════════════════════════════════════════════════ */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:clamp(12px,3vw,40px)}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(2,10,20,.66);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .5s ease}
.modal.on .modal-bg{opacity:1}
.sheet{
  position:relative;width:min(920px,100%);max-height:88svh;overflow:auto;border-radius:28px;
  opacity:0;transform:translateY(28px) scale(.97);
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.3,1);
}
.modal.on .sheet{opacity:1;transform:none}
.sheet .shead{position:relative;aspect-ratio:21/9;background-size:cover;background-position:center 26%}
.sheet .shead.slim{aspect-ratio:auto;height:14px;background:var(--a30)}
.sheet .sbody h3{font-family:var(--font-display);font-weight:500;font-size:clamp(1.4rem,3.6vw,2rem);margin:10px 0 0}
.sheet .shead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,16,28,.15) 30%,rgba(6,20,34,.96))}
.sheet .stitle{position:absolute;left:clamp(20px,4vw,40px);bottom:22px;z-index:1}
.sheet h3{font-family:var(--font-display);font-weight:500;font-size:clamp(1.5rem,4vw,2.3rem);letter-spacing:.04em;margin:0}
.sheet .sbody{padding:clamp(20px,4vw,40px);display:grid;gap:30px}
.sheet h4{
  font-family:var(--font-body);font-weight:500;font-size:.92rem;letter-spacing:.14em;
  color:var(--accent);margin:0 0 14px;display:flex;align-items:center;gap:10px;
}
.sheet h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--a40),transparent)}
.sheet p{color:var(--mist);line-height:2.05;font-size:.92rem;margin:0}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.feat li{color:var(--mist);font-size:.9rem;line-height:1.8;padding-left:20px;position:relative}
.feat li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 8px var(--accent)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.shots div{aspect-ratio:16/10;border-radius:14px;background-size:cover;background-position:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
/* ↓↓↓ 遊戲資源（.rar）就是貼在這一區 ↓↓↓ */
.dl{display:grid;gap:10px}
.dlrow{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;
  background:linear-gradient(140deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);
}
.dlrow .nm{font-size:.95rem}
.dlrow .meta{font-family:var(--font-mono);font-size:.68rem;color:var(--mist);opacity:.7;letter-spacing:.08em}
.dlrow .note2{width:100%;font-size:.78rem;color:var(--mist);opacity:.65;line-height:1.7}
.dlbtn{
  margin-left:auto;font-family:var(--font-body);font-size:.82rem;letter-spacing:.06em;
  padding:10px 20px;border-radius:12px;color:var(--ink);background:var(--accent);white-space:nowrap;
  box-shadow:0 8px 22px var(--a40);
  transition:transform .35s ease}
.dlbtn:hover{transform:translateY(-2px)}
.sysreq{font-family:var(--font-mono);font-size:.76rem;color:var(--mist);line-height:2}
.slinks{display:flex;flex-wrap:wrap;gap:10px}
.slink{padding:9px 16px;border-radius:12px;font-size:.84rem;color:var(--foam);

const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SMALL = innerWidth < 820;
const R = document.documentElement;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const srcOf = f => SMALL ? f.src.replace(/\.webp$/, "-sm.webp") : f.src;

/* ── 引擎 1：溶解遮罩 ─────────────────────────────────────── */
function buildMasks(n, size = 512, grid = 40){
  const small = document.createElement("canvas"); small.width = small.height = grid;
  const sc = small.getContext("2d"), img = sc.createImageData(grid, grid);
  for (let i = 0; i < grid*grid; i++){
    const v = Math.random()*255;
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  sc.putImageData(img, 0, 0);
  const big = document.createElement("canvas"); big.width = big.height = size;
  const bc = big.getContext("2d");
  bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = "high";
  bc.drawImage(small, 0, 0, size, size);
  const data = bc.getImageData(0, 0, size, size).data, masks = [];
  for (let k = 0; k < n; k++){
    const c = document.createElement("canvas"); c.width = c.height = size;
    const ctx = c.getContext("2d"), out = ctx.createImageData(size, size), center = (k+.5)/n;
    for (let i = 0; i < size*size; i++){
      const a = Math.max(0, 1 - Math.abs(data[i*4]/255 - center) * n * 1.45);
      out.data[i*4] = out.data[i*4+1] = out.data[i*4+2] = 255;
      out.data[i*4+3] = a*255;
    }
    ctx.putImageData(out, 0, 0);
    masks.push(c.toDataURL("image/png"));
  }
  return masks;
}

/* ── 引擎 2：切幀 + 配色 ───────────────────────────────────── */
const stage = document.getElementById("stage-inner");
const SLICES = RM ? 0 : (SMALL ? 2 : FRAME_SLICE);
const MASKS = SLICES ? buildMasks(SLICES - 1) : [];
const STEP = SMALL ? 130 : 175;
let frameIdx = 0, base = null, busy = false, ACCENT = FRAMES[0].accent;

function makeLayer(f, mask){
  const el = document.createElement("div");
  el.className = "grain";
  el.style.backgroundImage = `url("${srcOf(f)}")`;
  el.style.backgroundPosition = f.pos || "center";
  if (mask){
    el.style.webkitMaskImage = el.style.maskImage = `url("${mask}")`;
    el.style.webkitMaskSize  = el.style.maskSize  = "560px";
    el.style.webkitMaskRepeat = el.style.maskRepeat = "repeat";
  }
  return el;
}

const HEX = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
function setPalette(accent, warm){
  const [r,g,b] = HEX(accent), [wr,wg,wb] = HEX(warm);
  R.style.setProperty("--accent", accent);
  R.style.setProperty("--warm", warm);
  [8,10,14,20,26,30,40,55,70].forEach(a =>
    R.style.setProperty(`--a${String(a).padStart(2,"0")}`, `rgba(${r},${g},${b},${a/100})`));
  [14,30,50,70].forEach(a =>
    R.style.setProperty(`--w${a}`, `rgba(${wr},${wg},${wb},${a/100})`));
}

function applyPalette(i){
  const f = FRAMES[i];
  ACCENT = f.accent;
  setPalette(f.accent, f.warm);
  R.style.setProperty("--hero-img", `url("${srcOf(f)}")`);
  document.getElementById("hud-accent").textContent = f.accent;
  document.getElementById("hud-warm").textContent = f.warm;
  document.getElementById("hud-name").textContent = `FRAME ${String(i+1).padStart(2,"0")} · ${f.name}`;
  document.querySelectorAll("#ticks .tick").forEach((t,k) => t.classList.toggle("on", k === i));
  const bar = document.getElementById("timer"), head = document.getElementById("head");
  bar.style.transition = head.style.transition = "none";
  bar.style.transform = "scaleX(0)"; head.style.transform = "translate(0,-50%)";
  requestAnimationFrame(() => {
    bar.style.transition  = `transform ${FRAME_HOLD}ms linear`;
    head.style.transition = `transform ${FRAME_HOLD}ms linear`;
    bar.style.transform  = "scaleX(1)";
    head.style.transform = `translate(${innerWidth}px,-50%)`;
  });
}

function preload(i){ new Image().src = srcOf(FRAMES[i % FRAMES.length]); }

function showFirst(){
  document.getElementById("ticks").innerHTML = FRAMES.map(() => '<i class="tick"></i>').join("");
  base = document.createElement("div"); base.className = "frame";
  const l = makeLayer(FRAMES[0], null);
  base.appendChild(l); stage.appendChild(base);
  requestAnimationFrame(() => l.classList.add("on"));
  applyPalette(0); preload(1);
}

function nextFrame(){
  if (busy || document.hidden || FRAMES.length < 2) return;
  busy = true;
  document.body.classList.add("switching");        // 換幀期間降低模糊，避免整頁重算毛玻璃
  const idx = (frameIdx+1) % FRAMES.length, next = FRAMES[idx];
  const inc = document.createElement("div"); inc.className = "frame";
  const layers = [];
  MASKS.forEach((m,i) => {
    const l = makeLayer(next, m);
    l.style.setProperty("--del", (i*STEP/1000) + "s");
    l.style.setProperty("--dur", SMALL ? "1.0s" : "1.4s");
    layers.push(l); inc.appendChild(l);
  });
  const full = makeLayer(next, null);
  full.style.setProperty("--del", (MASKS.length*STEP/1000) + "s");
  full.style.setProperty("--dur", SMALL ? ".8s" : "1.1s");
  layers.push(full); inc.appendChild(full);
  stage.appendChild(inc);
  requestAnimationFrame(() => layers.forEach(l => l.classList.add("on")));
  applyPalette(idx);
  setTimeout(() => {
    if (base) base.remove();
    base = inc; frameIdx = idx; busy = false;
    document.body.classList.remove("switching");
    preload(idx+1);
  }, RM ? 40 : MASKS.length*STEP + (SMALL ? 900 : 1200));
}

/* ── 引擎 3：文字 ↔ 代碼 ───────────────────────────────────── */
const GLYPHS = "{}[]()<>/\\|=+-*&^%$#@!;:.,_~`?01";
class Morph{
  constructor(el){ this.el = el; this.frame = 0; this.q = []; }
  to(text){
    const from = this.el.textContent, len = Math.max(from.length, text.length);
    this.q = [];
    for (let i = 0; i < len; i++){
      const s = Math.floor(Math.random()*22);
      this.q.push({ a: from[i]||"", b: text[i]||"", s, e: s + 12 + Math.floor(Math.random()*22) });
    }
    cancelAnimationFrame(this.raf); this.frame = 0;
    return new Promise(res => { this.done = res; this.tick(); });
  }
  tick(){
    let out = "", done = 0;
    for (const q of this.q){
      if (this.frame >= q.e){ done++; out += q.b; }
      else if (this.frame >= q.s){
        if (!q.c || Math.random() < .3) q.c = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
        out += `<span style="opacity:.45">${esc(q.c)}</span>`;
      } else out += esc(q.a);
    }
    this.el.innerHTML = out;
    if (done === this.q.length) this.done && this.done();
    else { this.frame++; this.raf = requestAnimationFrame(() => this.tick()); }
  }
}
async function morphIn(el, code, label){
  if (RM){ el.textContent = label; return; }
  const m = el._m || (el._m = new Morph(el));
  el.classList.add("code");
  await m.to(code);
  await new Promise(r => setTimeout(r, 900));
  el.classList.remove("code");
  await m.to(label);
}

/* ── 引擎 4：捲動溶解 ─────────────────────────────────────── */
function splitChars(el){
  const text = el.textContent; el.textContent = "";
  [...text].forEach(ch => {
    const s = document.createElement("span");
    s.className = "ch"; s.textContent = ch;
    s.style.setProperty("--d", (Math.random()*.55).toFixed(3) + "s");
    el.appendChild(s);
  });
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){
    e.target.classList.add("in");
    const code = e.target.dataset.code;
    if (code && !e.target.dataset.played){
      e.target.dataset.played = "1";
      morphIn(e.target, code, e.target.dataset.label);
    }
  } else e.target.classList.remove("in");
}), { rootMargin: "-6% 0px -12% 0px", threshold: .01 });

function watch(root = document){
  root.querySelectorAll("[data-reveal]:not([data-watched])").forEach((el,i) => {
    el.dataset.watched = "1";
    if (el.dataset.reveal === "chars") splitChars(el);
    else if (!el.style.getPropertyValue("--d")) el.style.setProperty("--d", (i%6)*.07 + "s");
    io.observe(el);
  });
}

/* ── 引擎 5：粒子（氣泡 + 花葉 + 彼岸花 + 拖曳灑花）──────────── */
function fxLayer(){
  if (RM) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  const cvT = document.getElementById("fxTop"), ctxT = cvT.getContext("2d");
  let bubbles = [], flora = [], burst = [], lily = [];
  let mx = -999, my = -999, down = false, lastEmit = 0;

  const rnd = (a,b) => a + Math.random()*(b-a);
  const BLUE  = (a) => `rgba(120,196,255,${a})`;
  const BLUE2 = (a) => `rgba(70,146,240,${a})`;
  const PALE  = (a) => `rgba(206,238,255,${a})`;

  const mkFlora = (y) => ({
    x: rnd(-40, innerWidth+40), y: y ?? rnd(-60, innerHeight),
    vx: rnd(-.38,-.04), vy: rnd(.22,.72), r: rnd(0,6.28), vr: rnd(-.02,.02),
    s: rnd(6,13), a: rnd(.30,.62), sw: rnd(0,6.28), leaf: Math.random() < .34
  });

  const resize = () => {
    const dpr = Math.min(devicePixelRatio||1, 1.5);
    cv.width = cvT.width = innerWidth*dpr; cv.height = cvT.height = innerHeight*dpr;
    cv.style.width = cvT.style.width = innerWidth+"px";
    cv.style.height = cvT.style.height = innerHeight+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0); ctxT.setTransform(dpr,0,0,dpr,0,0);
    const nb = FX.bubbles ? Math.round(Math.min(innerWidth,1600)/(SMALL?34:20)) : 0;
    bubbles = Array.from({length:nb}, () => ({
      x: Math.random()*innerWidth, y: Math.random()*innerHeight,
      r: rnd(1.2,5.6), sp: rnd(.18,.72), ph: rnd(0,6.28), a: rnd(.12,.42)
    }));
    const nf = FX.flora ? Math.round(FX.floraCount * (SMALL?.5:1)) : 0;
    flora = Array.from({length:nf}, () => mkFlora());
  };
  addEventListener("resize", resize, {passive:true});
  resize();

  /* —— 畫花瓣 / 葉子 —— */
  let g2 = null;                       // 目前作畫的畫布
  const use = c => { g2 = c; };
  function petal(x,y,r,s,a,leaf){
    const ctx = g2; ctx.save(); ctx.translate(x,y); ctx.rotate(r);
    ctx.beginPath();
    if (leaf){
      ctx.moveTo(0,-s); ctx.quadraticCurveTo(s*.55,0, 0,s); ctx.quadraticCurveTo(-s*.55,0, 0,-s);
      ctx.fillStyle = BLUE2(a*.75); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,-s*.85); ctx.lineTo(0,s*.85);
      ctx.strokeStyle = PALE(a*.5); ctx.lineWidth = .7; ctx.stroke();
    } else {
      ctx.moveTo(0,-s);
      ctx.bezierCurveTo(s*.85,-s*.5, s*.7,s*.65, 0,s);
      ctx.bezierCurveTo(-s*.7,s*.65, -s*.85,-s*.5, 0,-s);
      const g = ctx.createLinearGradient(0,-s,0,s);
      g.addColorStop(0, PALE(a)); g.addColorStop(1, BLUE(a*.85));
      ctx.fillStyle = g; ctx.fill();
    }
    ctx.restore();
  }
  const MAPLE = [[0,-1],[.12,-.62],[.4,-.68],[.32,-.42],[.72,-.22],[.6,-.06],[.86,.16],
                 [.3,.14],[.38,.4],[.14,.32],[.16,.86],[0,.66],[-.16,.86],[-.14,.32],
                 [-.38,.4],[-.3,.14],[-.86,.16],[-.6,-.06],[-.72,-.22],[-.32,-.42],[-.4,-.68],[-.12,-.62]];
  function maple(x,y,r,s,a){
    const ctx = g2; ctx.save(); ctx.translate(x,y); ctx.rotate(r); ctx.scale(s,s);
    ctx.beginPath(); ctx.moveTo(MAPLE[0][0],MAPLE[0][1]);
    for (let i=1;i<MAPLE.length;i++) ctx.lineTo(MAPLE[i][0],MAPLE[i][1]);
    ctx.closePath();
    const g = ctx.createLinearGradient(0,-1,0,1);
    g.addColorStop(0, PALE(a)); g.addColorStop(1, BLUE2(a));
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,.66); ctx.lineTo(0,-.5);
    ctx.strokeStyle = PALE(a*.55); ctx.lineWidth = .06; ctx.stroke();
    ctx.restore();
  }
  function spark(x,y,s,a){
    const ctx = g2; ctx.beginPath(); ctx.arc(x,y,s*.34,0,6.2832);
    ctx.fillStyle = PALE(a); ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,s*.8,0,6.2832);
    ctx.fillStyle = BLUE(a*.35); ctx.fill();
  }
  function heart(x,y,r,s,a){
    const ctx = g2; ctx.save(); ctx.translate(x,y); ctx.rotate(r); ctx.scale(s/16,s/16);
    ctx.beginPath(); ctx.moveTo(0,5);
    ctx.bezierCurveTo(-14,-6,-8,-16,0,-8);
    ctx.bezierCurveTo(8,-16,14,-6,0,5);
    ctx.fillStyle = BLUE(a); ctx.fill();
    ctx.restore();
  }
  function mail(x,y,r,s,a){
    const ctx = g2; ctx.save(); ctx.translate(x,y); ctx.rotate(r);
    const w = s*1.35, h = s;
    ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,2.5);
    ctx.fillStyle = PALE(a*.9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-w/2,-h/2); ctx.lineTo(0,h*.12); ctx.lineTo(w/2,-h/2);
    ctx.strokeStyle = BLUE2(a); ctx.lineWidth = 1.1; ctx.stroke();
    ctx.restore();
  }
  /* —— 彼岸花：六片外翻花瓣 + 長蕊 —— */
  function spiderLily(x,y,t,size){
    const ctx = g2;
    const e = 1 - Math.pow(1-t, 3), a = (1-t) * .9;
    ctx.save(); ctx.translate(x,y);
    for (let i = 0; i < 6; i++){
      const ang = i/6*6.2832 + t*.35, L = size*e;
      ctx.save(); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.bezierCurveTo(L*.30,-L*.34, L*.86,-L*.30, L, L*.16);   // 外翻的花瓣
      ctx.bezierCurveTo(L*.80,-L*.06, L*.36,-L*.02, 0,0);
      const g = ctx.createLinearGradient(0,0,L,0);
      g.addColorStop(0, PALE(a)); g.addColorStop(1, BLUE(a*.5));
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,0);                            // 花蕊
      ctx.quadraticCurveTo(L*.75,-L*.62, L*1.30,-L*.52);
      ctx.strokeStyle = PALE(a*.75); ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(L*1.30,-L*.52, 1.7, 0, 6.2832);
      ctx.fillStyle = PALE(a); ctx.fill();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0, size*.10*e, 0, 6.2832);
    ctx.fillStyle = PALE(a*.9); ctx.fill();
    ctx.restore();
  }

  const KINDS = ["petal","maple","mail","heart","spark","spark"];   // 改這裡就能調種類比例
  const emit = (x,y,vx,vy) => {
    burst.push({ x, y, vx, vy, r: rnd(0,6.28), vr: rnd(-.2,.2),
                 s: rnd(13,24), a: 1, life: rnd(1.4,2.4), t: 0,
                 kind: KINDS[Math.random()*KINDS.length|0] });
    if (burst.length > 260) burst.shift();
  };

  addEventListener("pointermove", e => {
    mx = e.clientX; my = e.clientY;
    if ((down || (e.buttons & 1)) && FX.dragConfetti && performance.now() - lastEmit > 16){
      lastEmit = performance.now();
      const n = SMALL ? 2 : 3;
      for (let i = 0; i < n; i++)
        emit(mx + rnd(-14,14), my + rnd(-14,14),
             rnd(-2.6,2.6) - (e.movementX||0)*.10,
             rnd(-2.4,.4)  - (e.movementY||0)*.09);
    }
  }, {passive:true});
  addEventListener("pointerdown", e => {
    down = true;
    if (FX.clickLily){
      lily.push({ x:e.clientX, y:e.clientY, t:0, size:rnd(26,42) });
      if (lily.length > 6) lily.shift();
      for (let i = 0; i < 7; i++){                     // 開花同時濺出一小圈花瓣
        const a = i/7*6.2832 + rnd(-.2,.2), v = rnd(1.6,3.6);
        emit(e.clientX, e.clientY, Math.cos(a)*v, Math.sin(a)*v - 1);
      }
    }
  }, {passive:true});
  addEventListener("pointerup",     () => down = false, {passive:true});
  addEventListener("pointercancel", () => down = false, {passive:true});
  /* 觸控：手指滑動＝捲動，pointer 事件會被取消，所以直接聽 touchmove */
  addEventListener("touchmove", e => {
    if (!FX.dragConfetti) return;
    const t = e.touches[0]; if (!t) return;
    mx = t.clientX; my = t.clientY;
    if (performance.now() - lastEmit > 22){
      lastEmit = performance.now();
      for (let i = 0; i < 2; i++)
        emit(mx + rnd(-12,12), my + rnd(-12,12), rnd(-2.2,2.2), rnd(-2.2,.4));
    }
  }, {passive:true});

  const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  let t = 0, last = performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min((now - last)/1000, .05); last = now;
    if (document.hidden) return;
    t += .01;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ctxT.clearRect(0,0,innerWidth,innerHeight);
    use(ctx);

    const [cr,cg,cb] = hex2rgb(ACCENT);
    for (const p of bubbles){
      p.y -= p.sp; p.x += Math.sin(t + p.ph)*.32;
      const dx = p.x-mx, dy = p.y-my, d2 = dx*dx+dy*dy;
      if (d2 < 14400){ const f = (120-Math.sqrt(d2))/120*1.9; p.x += dx*f*.05; p.y += dy*f*.05; }
      if (p.y < -20){ p.y = innerHeight+20; p.x = Math.random()*innerWidth; }
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832);
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${p.a*.26})`; ctx.fill();
      ctx.lineWidth = .9; ctx.strokeStyle = `rgba(${cr},${cg},${cb},${p.a})`; ctx.stroke();
    }

    for (const f of flora){
      f.sw += .012;
      f.x += f.vx + Math.sin(f.sw)*.45; f.y += f.vy; f.r += f.vr;
      if (f.y > innerHeight+40 || f.x < -60){ Object.assign(f, mkFlora(-40)); }
      petal(f.x, f.y, f.r, f.s, f.a, f.leaf);
    }

    use(ctxT);                          // 以下畫在最上層，才不會被玻璃蓋住
    for (let i = burst.length-1; i >= 0; i--){
      const b = burst[i]; b.t += dt;
      if (b.t > b.life){ burst.splice(i,1); continue; }
      b.vy += 22*dt*.06; b.vx *= .992;
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      const a = (1 - b.t/b.life) * .95;
      ctxT.shadowColor = "rgba(130,200,255,.85)"; ctxT.shadowBlur = 14;
      if (b.kind === "petal")      petal(b.x,b.y,b.r,b.s,a,false);
      else if (b.kind === "maple") maple(b.x,b.y,b.r*.5,b.s*.62,a);
      else if (b.kind === "heart") heart(b.x,b.y,b.r*.3,b.s,a);
      else if (b.kind === "spark") spark(b.x,b.y,b.s*.7,a);
      else                          mail(b.x,b.y,b.r*.25,b.s,a);
      ctxT.shadowBlur = 0;
    }

    for (let i = lily.length-1; i >= 0; i--){
      const L = lily[i]; L.t += dt/1.25;
      if (L.t >= 1){ lily.splice(i,1); continue; }
      ctxT.shadowColor = "rgba(150,215,255,.9)"; ctxT.shadowBlur = 18;
      spiderLily(L.x, L.y, L.t, L.size);
      ctxT.shadowBlur = 0;
    }
  })(performance.now());
}

/* HKT / GMT 雙時鐘 */
const fmt = tz => new Intl.DateTimeFormat("en-GB",
  { timeZone: tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false });
const fHKT = fmt("Asia/Hong_Kong"), fGMT = fmt("UTC");
(function clock(){
  const now = new Date(), blink = now.getSeconds() % 2 ? "bl" : "";
  const paint = (el, txt) => el.innerHTML = txt.replace(/:/g, `<span class="${blink}">:</span>`);
  paint(document.getElementById("hkt"), fHKT.format(now));
  paint(document.getElementById("gmt"), fGMT.format(now));
  setTimeout(clock, 1000 - (Date.now() % 1000));
})();

/* 首屏離開視線就暫停推鏡，看不到的東西不必一直重繪 */
new IntersectionObserver(es => es.forEach(e => {
  stage.style.animationPlayState = e.isIntersecting ? "running" : "paused";
}), {threshold:.01}).observe(document.querySelector(".hero"));

/* 玻璃反光 */
addEventListener("pointermove", e => {
  const g = e.target.closest?.(".glass, .card"); if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty("--mx", ((e.clientX-r.left)/r.width*100) + "%");
  g.style.setProperty("--my", ((e.clientY-r.top)/r.height*100) + "%");
}, {passive:true});

/* 捲動進度 */
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const max = document.body.scrollHeight - innerHeight;
    R.style.setProperty("--sp", max > 0 ? Math.min(scrollY/max,1).toFixed(3) : 0);
    ticking = false;
  });
}, {passive:true});

/* 分頁高亮 + 滑動指示塊 */
const ind = document.getElementById("ind");
function moveInd(tab){
  if (!tab) return;
  ind.style.opacity = "1";
  ind.style.width = tab.offsetWidth + "px";
  ind.style.transform = `translateX(${tab.offsetLeft - 4}px)`;
}
const navIO = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  let hit = null;
  document.querySelectorAll("#menu .tab").forEach(a => {
    const on = a.dataset.jump === e.target.id;
    a.classList.toggle("active", on); if (on) hit = a;
  });
  moveInd(hit);
}), { rootMargin: "-45% 0px -45% 0px" });
SECTIONS.forEach(s => { const el = document.getElementById(s.id); if (el) navIO.observe(el); });
addEventListener("resize", () => moveInd(document.querySelector("#menu .tab.active")), {passive:true});

/* 訂閱狀態：由 /api/subs 每日回報（沒部署 API 就整條隱藏，不影響頁面） */
async function refreshSubs(){
  try{
    const r = await fetch(SUBS_API, { cache:"no-store" });
    if (!r.ok) return;
    const list = await r.json();
    for (const it of list){
      const el = document.querySelector(`[data-live="${CSS.escape(it.url)}"]`);
      if (!el) continue;
      const bits = [];
      if (it.nodes)  bits.push(`${it.nodes} 節點`);
      if (it.left)   bits.push(`剩餘 ${it.left}`);
      if (it.expire) bits.push(`到期 ${it.expire}`);
      if (it.checked)bits.push(`檢查於 ${it.checked}`);
      el.innerHTML = `<span class="dot"></span><span>${it.alive ? "可用" : "沒有回應"}</span>` +
                     bits.map(b => `<span>· ${b}</span>`).join("");
      el.classList.toggle("bad", !it.alive);
      el.classList.add("show");
    }
  }catch(e){ /* 靜默略過 */ }
}
refreshSubs();

/* 訂閱連結複製 */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); }
  catch { const t = document.createElement("textarea"); t.value = b.dataset.copy;
          document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  b.textContent = "已複製"; b.classList.add("done");
  setTimeout(() => { b.textContent = "複製"; b.classList.remove("done"); }, 1600);
});

/* 分頁 hover：亂碼 3 秒 → 回原字 1 秒 → 循環；滑鼠移開立刻停 */
const NOISE_MS = 3000, PLAIN_MS = 1000;
class HoverNoise{
  constructor(el, label){ this.el = el; this.label = label; this.live = false; }
  start(){
    if (this.live || RM) return;
    this.live = true;
    this.el.style.width = this.el.offsetWidth + "px";   // 鎖寬，亂碼時版面不跳
    this.el.style.textAlign = "center";
    this.loop();
  }
  stop(){
    this.live = false;
    cancelAnimationFrame(this.raf); clearTimeout(this.timer);
    this.el.textContent = this.label;
    this.el.style.width = ""; this.el.style.textAlign = "";
  }
  loop(){
    if (!this.live) return;
    const end = performance.now() + NOISE_MS;
    let last = 0;
    const tick = now => {
      if (!this.live) return;
      if (now < end){
        if (now - last > 55){
          last = now;
          this.el.textContent = [...this.label]
            .map(c => c === " " ? " " : GLYPHS[Math.random()*GLYPHS.length|0]).join("");
        }
        this.raf = requestAnimationFrame(tick);
      } else {
        this.el.textContent = this.label;                // 回歸原字 1 秒
        this.timer = setTimeout(() => this.loop(), PLAIN_MS);
      }
    };
    this.raf = requestAnimationFrame(tick);
  }
}
document.querySelectorAll("#menu .tab").forEach(a => {
  const n = new HoverNoise(a, a.textContent);
  a.addEventListener("pointerenter", () => n.start());
  a.addEventListener("pointerleave", () => n.stop());
  a.addEventListener("blur", () => n.stop());
});
